name: 'system-releaser'
description: 'Universal language-agnostic release manager - cross-platform builds & package distribution'
author: 'system-releaser'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token with contents:write permission for creating releases and uploading assets'
    required: false
    default: ''
  github-token:
    description: 'Alternative alias for github_token'
    required: false
    default: ''
  version_bump:
    description: 'Optional version bump type: patch, minor, major, or explicit semver string'
    required: false
    default: ''
  skip_tests:
    description: 'Skip running project tests prior to release (true/false)'
    required: false
    default: 'false'
  extra_args:
    description: 'Additional flags passed directly to system-releaser release'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Verify or install system-releaser
      shell: bash
      run: |
        if ! command -v system-releaser >/dev/null 2>&1; then
          echo "system-releaser not in PATH. Attempting automatic installation..."
          if command -v cargo >/dev/null 2>&1; then
            cargo install --path . || cargo install system-releaser || true
          fi
        fi

    - name: Setup containerless cross-compilation toolchains
      shell: bash
      run: |
        if command -v pip >/dev/null 2>&1; then
          echo "Installing ziglang and cargo-zigbuild for multi-platform compilation..."
          pip install --quiet ziglang cargo-zigbuild || true
        fi

    - name: Execute system-releaser release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token || inputs.github-token || env.GITHUB_TOKEN }}
        INPUT_VERSION_BUMP: ${{ inputs.version_bump }}
        INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra_args }}
      run: |
        ARGS=("release")
        if [ -n "$INPUT_VERSION_BUMP" ]; then
          case "$INPUT_VERSION_BUMP" in
            patch) ARGS+=("--patch") ;;
            minor) ARGS+=("--minor") ;;
            major) ARGS+=("--major") ;;
            *) ARGS+=("--set-version" "$INPUT_VERSION_BUMP") ;;
          esac
        fi
        if [ "$INPUT_SKIP_TESTS" = "true" ]; then
          ARGS+=("--skip-tests")
        fi
        if [ -n "$INPUT_EXTRA_ARGS" ]; then
          read -r -a EXTRA <<< "$INPUT_EXTRA_ARGS"
          ARGS+=("${EXTRA[@]}")
        fi
        echo "Executing: system-releaser ${ARGS[*]}"
        system-releaser "${ARGS[@]}"

    - name: Commit and push updated README installation guide
      shell: bash
      run: |
        if [ -n "$(git status --porcelain README.md 2>/dev/null)" ] || [ -n "$(git status --porcelain readme.md 2>/dev/null)" ]; then
          echo "Detected updated README from system-releaser. Committing and pushing back to repository..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md readme.md 2>/dev/null || true
          git commit -m "docs: update README installation guide for release [skip ci]" || true

          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo HEAD)"
          if [ "$CURRENT_BRANCH" = "HEAD" ]; then
            DEFAULT_BRANCH="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@')"
            [ -z "$DEFAULT_BRANCH" ] && DEFAULT_BRANCH="main"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH" || git push origin "HEAD:refs/heads/master" || true
          else
            git push origin "$CURRENT_BRANCH" || true
          fi
        fi

